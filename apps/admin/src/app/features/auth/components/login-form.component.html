<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  novalidate
  [attr.aria-busy]="busy()"
  class="space-y-6"
>
  <app-problem [problem]="problem()" />
  <div>
    <label for="email" class="mb-2 block text-sm font-semibold"
      >Correo electrónico</label
    >
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="username"
      inputmode="email"
      autocapitalize="none"
      spellcheck="false"
      [readOnly]="busy()"
      [attr.aria-invalid]="
        form.controls.email.invalid && form.controls.email.touched
      "
      aria-describedby="email-help"
      class="min-h-12 w-full rounded-xl border border-line bg-white px-4 py-3 text-base placeholder:text-muted focus-visible:border-primary"
      placeholder="tu@correo.com"
    />
    <p
      id="email-help"
      class="mt-2 min-h-5 text-xs"
      [class.text-danger]="
        form.controls.email.invalid && form.controls.email.touched
      "
      [class.text-muted]="
        !(form.controls.email.invalid && form.controls.email.touched)
      "
    >
      @if (form.controls.email.invalid && form.controls.email.touched) {
        Escribe un correo electrónico válido.
      } @else {
        Usa el correo asociado a tu cuenta.
      }
    </p>
  </div>
  <div>
    <label for="password" class="mb-2 block text-sm font-semibold"
      >Contraseña</label
    >
    <div class="relative">
      <input
        id="password"
        [type]="visible() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
        [readOnly]="busy()"
        [attr.aria-invalid]="
          form.controls.password.invalid && form.controls.password.touched
        "
        aria-describedby="password-help"
        class="min-h-12 w-full rounded-xl border border-line bg-white py-3 ps-4 pe-14 text-base placeholder:text-muted focus-visible:border-primary"
        placeholder="Tu contraseña"
      />
      <button
        type="button"
        (click)="visible.set(!visible())"
        [attr.aria-label]="
          visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'
        "
        [attr.aria-pressed]="visible()"
        class="absolute inset-y-1 end-1 flex min-w-11 items-center justify-center rounded-lg text-muted hover:bg-paper hover:text-ink"
      >
        <app-icon [name]="visible() ? 'eye-off' : 'eye'" />
      </button>
    </div>
    <p id="password-help" class="mt-2 min-h-5 text-xs text-danger">
      @if (form.controls.password.invalid && form.controls.password.touched) {
        Escribe tu contraseña (máximo 128 caracteres).
      }
    </p>
  </div>
  <button
    type="submit"
    [disabled]="busy()"
    class="flex min-h-12 w-full items-center justify-center gap-3 rounded-xl bg-primary px-5 py-3 font-semibold text-white transition-colors hover:bg-primary-strong disabled:cursor-wait disabled:opacity-70"
  >
    @if (busy()) {
      <span role="status">Entrando…</span>
    } @else {
      Entrar a mi espacio <app-icon name="arrow" />
    }
  </button>
</form>
