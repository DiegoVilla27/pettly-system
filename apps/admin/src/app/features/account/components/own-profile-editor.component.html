<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  novalidate
  [attr.aria-busy]="busy()"
  class="space-y-8"
>
  <fieldset [disabled]="busy()" class="space-y-6">
    <legend class="mb-5 text-lg font-semibold">Datos de la cuenta</legend>
    <div class="grid gap-x-6 gap-y-5 sm:grid-cols-2">
      @for (field of fields; track field.key) {
        <div>
          <label
            [for]="'profile-' + field.key"
            class="mb-2 block text-sm font-semibold"
            >{{ field.label }}</label
          >
          @if (field.key === 'countryCode') {
            <select
              [id]="'profile-' + field.key"
              [formControlName]="field.key"
              [attr.autocomplete]="field.autocomplete"
              [attr.aria-invalid]="
                form.controls[field.key].invalid &&
                form.controls[field.key].touched
              "
              [attr.aria-describedby]="'profile-' + field.key + '-help'"
              class="min-h-12 w-full rounded-xl border border-line bg-white px-4 py-3"
            >
              <option value="">Sin especificar</option>
              @for (country of countries; track country.value) {
                <option [value]="country.value">{{ country.label }}</option>
              }
            </select>
          } @else {
            <input
              [id]="'profile-' + field.key"
              [type]="field.type"
              [formControlName]="field.key"
              [attr.autocomplete]="field.autocomplete"
              [attr.maxlength]="field.max"
              [attr.aria-invalid]="
                form.controls[field.key].invalid &&
                form.controls[field.key].touched
              "
              [attr.aria-describedby]="'profile-' + field.key + '-help'"
              class="min-h-12 w-full rounded-xl border border-line bg-white px-4 py-3"
            />
          }
          <p
            [id]="'profile-' + field.key + '-help'"
            class="mt-2 text-xs leading-relaxed"
            [class.text-danger]="
              form.controls[field.key].invalid &&
              form.controls[field.key].touched
            "
            [class.text-muted]="
              !(
                form.controls[field.key].invalid &&
                form.controls[field.key].touched
              )
            "
          >
            {{ field.help }}
          </p>
        </div>
      }
    </div>
  </fieldset>
  @if (issue()) {
    <p role="alert" class="text-sm text-danger">{{ issue() }}</p>
  }
  <button
    type="submit"
    [disabled]="busy()"
    class="min-h-12 rounded-xl bg-primary px-6 py-3 font-semibold text-white hover:bg-primary-strong disabled:opacity-60"
  >
    {{
      busy() ? 'Guardando…' : user() ? 'Guardar perfil' : 'Enviar invitación'
    }}
  </button>
</form>
