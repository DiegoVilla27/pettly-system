name: Reusable Flutter CI

on:
  workflow_call:
    outputs:
      tests:
        value: ${{ jobs.static-checks.outputs.tests }}

permissions:
  contents: read

jobs:
  static-checks:
    name: Dart format and Flutter analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tests: ${{ steps.tests.outputs.state }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib
      - run: flutter analyze --no-pub
      - name: Run Flutter tests when available
        id: tests
        run: |
          if [ -d test ] && find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test --no-pub --coverage
            echo 'state=success' >> "$GITHUB_OUTPUT"
          else
            echo 'state=not_configured' >> "$GITHUB_OUTPUT"
            echo 'No hay suite Flutter configurada; no se han ejecutado tests de aplicación.' >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Android development APK
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  quality-gate:
    name: Mobile quality gate
    needs: [static-checks, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate Flutter results
        env:
          STATIC_RESULT: ${{ needs.static-checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_STATE: ${{ needs.static-checks.outputs.tests }}
        run: |
          test "$STATIC_RESULT" = success
          test "$BUILD_RESULT" = success
          case "$TEST_STATE" in success|not_configured) ;; *) exit 1 ;; esac
